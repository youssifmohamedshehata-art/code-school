<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الاشتراك في الكورس</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="register">

<h1>الاشتراك في الكورس</h1>

<form>

<input type="text" placeholder="الاسم بالكامل" required>

<input type="email" placeholder="البريد الإلكتروني" required>

<input type="tel" placeholder="رقم الهاتف" required>

<select required>

<option>اختر الكورس</option>

<option>HTML - 400 جنيه</option>

<option>CSS - 450 جنيه</option>

<option>JavaScript - 600 جنيه</option>

<option>Python - 800 جنيه</option>

</select>

<h2>طريقة الدفع</h2>

<label class="pay">

<input type="radio" name="pay">

بطاقة بنكية (Visa / Mastercard)

</label>

<label class="pay">

<input type="radio" name="pay">

فوري

</label>

<div class="fawry-box">

<input type="text" placeholder="رقم عملية فوري (اختياري)">

</div>

<div class="card-box">

<input type="text" placeholder="اسم صاحب البطاقة">

<input type="text" placeholder="رقم البطاقة">

<input type="text" placeholder="MM/YY">

<input type="password" placeholder="CVV">

</div>

<button type="submit">

تأكيد الاشتراك

</button>

</form>

<a href="index.html" class="back">

العودة للرئيسية

</a>

</div>

<script scr="script.js"></script>

</body>

</html>
